<div id="report-contact" class="mt-3 space-y-4">
    <p class="text-sm text-muted">
        Reach out directly to the person who posted this report.
    </p>

    <!-- Revealed Phone Number + Copy Button -->
    <div
        x-data="{
            copied: false,
            async copyPhone() {
                try {
                    await navigator.clipboard.writeText('{{ report.phone_number|escapejs }}');
                    this.copied = true;
                    setTimeout(() => { this.copied = false; }, 2000);
                } catch (e) {}
            }
        }"
        class="flex items-center justify-between gap-2 rounded-xl border border-border bg-page px-3.5 py-2.5"
    >
        <div class="min-w-0">
            <p class="text-xs font-medium text-muted">Phone number</p>
            <p class="truncate font-mono text-base font-semibold text-ink">
                {{ report.phone_number }}
            </p>
        </div>

        <button
            type="button"
            @click="copyPhone()"
            class="btn btn-secondary btn-sm min-h-9 shrink-0 px-3"
        >
            <span x-text="copied ? 'Copied' : 'Copy'">Copy</span>
        </button>
    </div>

    <!-- Primary Contact Actions -->
    <div class="grid grid-cols-1 gap-2.5 sm:grid-cols-2">
        <a
            href="tel:{{ report.phone_number }}"
            class="btn btn-navy w-full"
        >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <span>Call</span>
        </a>

        {% if whatsapp_number %}
            <a
                href="https://wa.me/{{ whatsapp_number }}"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-success w-full"
            >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                <span>WhatsApp</span>
            </a>
        {% endif %}
    </div>

    <!-- Safe Meetup Reminder -->
    <p class="rounded-lg border border-border bg-page px-3 py-2 text-xs leading-relaxed text-muted">
        Safety tip: Verify identifying details before meeting, and arrange handovers in a safe, public place.
    </p>
</div>
