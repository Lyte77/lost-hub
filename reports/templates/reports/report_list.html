{% extends "base.html" %}

{% block content %}

<section>

    <header>
        <h1>
            Lost & Found Reports
        </h1>
    </header>


    <form
        id="report-filters"
        hx-get="{% url 'reports:list' %}"
        hx-target="#report-results"
        hx-swap="outerHTML"
        hx-trigger="change,  keyup changed delay:400ms from:#report-search,nearby"
    >

     <input
        type="search"
        id="report-search"
        name="q"
        value="{{ search_query }}"
        placeholder="Search phones, wallets, keys..."
        autocomplete="off"
    >

        <select name="type">

            <option value="">
                All reports
            </option>

            <option
                value="lost"
                {% if selected_type == "lost" %}
                    selected
                {% endif %}
            >
                Lost
            </option>

            <option
                value="found"
                {% if selected_type == "found" %}
                    selected
                {% endif %}
            >
                Found
            </option>

        </select>


        <select name="category">

            <option value="">
                All categories
            </option>

            {% for category in categories %}

                <option
                    value="{{ category.slug }}"
                    {% if selected_category == category.slug %}
                        selected
                    {% endif %}
                >
                    {{ category.name }}
                </option>

            {% endfor %}

        </select>

        <input
    type="hidden"
    name="lat"
    id="nearby-latitude"
>

<input
    type="hidden"
    name="lon"
    id="nearby-longitude"
>

<input
    type="hidden"
    name="nearby"
    id="nearby-enabled"
    value="0"
>

<select
    name="radius"
    id="nearby-radius"
>
    <option value="1">
        Within 1 km
    </option>

    <option value="5" selected>
        Within 5 km
    </option>

    <option value="10">
        Within 10 km
    </option>

    <option value="25">
        Within 25 km
    </option>
</select>

<button
    type="button"
    id="near-me-button"
>
    📍 Near me
</button>

<button
    type="button"
    id="clear-nearby-button"
    hidden
>
    Clear nearby
</button>

<p id="nearby-status"></p>

    </form>


    {% include "reports/partials/_report_results.html" %}

</section>

{% endblock %}
