{% if messages %}
    <div class="app-container pt-4" aria-live="polite">
        <div class="space-y-2.5">
            {% for message in messages %}
                <div
                    x-data="{ open: true }"
                    x-show="open"
                    role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}"
                    class="alert {% if message.level_tag == 'success' %}alert-success{% elif message.level_tag == 'error' %}alert-error{% elif message.level_tag == 'warning' %}alert-warning{% else %}alert-info{% endif %} justify-between"
                >
                    <div class="flex items-start gap-2.5">
                        <svg class="mt-0.5 h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            {% if message.level_tag == 'success' %}
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <path d="m9 11 3 3L22 4"/>
                            {% elif message.level_tag == 'error' or message.level_tag == 'warning' %}
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" x2="12" y1="8" y2="12"/>
                                <line x1="12" x2="12.01" y1="16" y2="16"/>
                            {% else %}
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 16v-4"/>
                                <path d="M12 8h.01"/>
                            {% endif %}
                        </svg>
                        <span>{{ message }}</span>
                    </div>

                    <button
                        type="button"
                        @click="open = false"
                        aria-label="Dismiss notification"
                        class="-m-1 inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md opacity-70 hover:opacity-100"
                    >
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 6 6 18"/>
                            <path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>
            {% endfor %}
        </div>
    </div>
{% endif %}
