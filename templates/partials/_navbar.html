<header
    x-data="{ mobileOpen: false }"
    @keydown.escape.window="mobileOpen = false"
    class="sticky top-0 left-0 right-0 z-40 w-full bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] transition-all duration-300"
>
    <div class="app-container">
        <div class="flex h-16 items-center justify-between gap-4">
            <!-- Brand & Community Tag -->
            <div class="flex items-center gap-3 shrink-0">
                <a
                    href="{% url 'reports:home' %}"
                    class="group inline-flex min-h-11 items-center gap-2.5 rounded-lg pr-1"
                >
                    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary-container text-secondary-container shadow-xs transition-transform duration-300 group-hover:scale-105">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </span>
                    <span class="text-lg font-bold tracking-tight text-primary">LostHub</span>
                </a>

                <span class="hidden xl:inline-flex items-center gap-1.5 rounded-full bg-surface-container-high px-2.5 py-1 text-[11px] font-bold tracking-wide text-on-surface-variant">
                    <span class="h-1.5 w-1.5 rounded-full bg-secondary"></span>
                    Community Recovery
                </span>
            </div>

            <!-- Desktop Navigation -->
            <nav class="hidden items-center gap-1 lg:flex" aria-label="Primary navigation">
                <a
                    href="{% url 'reports:home' %}"
                    class="inline-flex min-h-10 items-center rounded-lg px-3.5 py-2 text-sm font-semibold transition-all duration-200 {% if request.resolver_match.url_name == 'repohome' %}bg-primary-container text-on-primary shadow-sm{% else %}text-on-surface-variant hover:bg-surface-container hover:text-on-surface{% endif %}"
                >
                    Home
                </a>
                <a
                    href="{% url 'reports:list' %}"
                    class="inline-flex min-h-10 items-center rounded-lg px-3.5 py-2 text-sm font-semibold transition-all duration-200 {% if request.resolver_match.url_name == 'list' %}bg-primary-container text-on-primary shadow-sm{% else %}text-on-surface-variant hover:bg-surface-container hover:text-on-surface{% endif %}"
                >
                    Browse Reports
                </a>
                <a
                    href="{% url 'reports:home' %}#how-it-works"
                    class="inline-flex min-h-10 items-center rounded-lg px-3.5 py-2 text-sm font-semibold text-on-surface-variant transition-all duration-200 hover:bg-surface-container hover:text-on-surface"
                >
                    How It Works
                </a>
                <a
                    href="{% url 'reports:home' %}#nearby-reports"
                    class="inline-flex min-h-10 items-center rounded-lg px-3.5 py-2 text-sm font-semibold text-on-surface-variant transition-all duration-200 hover:bg-surface-container hover:text-on-surface"
                >
                    Near Me
                </a>
            </nav>

            <!-- Right Actions -->
            <div class="flex items-center gap-2 sm:gap-3">
                <a
                    href="{% url 'reports:list' %}"
                    aria-label="Search reports"
                    class="hidden sm:inline-flex h-10 w-10 items-center justify-center rounded-lg text-on-surface-variant transition-all duration-200 hover:bg-surface-container hover:text-on-surface active:scale-90"
                >
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                </a>

                <a
                    href="{% url 'reports:create' %}"
                    class="btn btn-primary btn-sm sm:min-h-10 sm:px-4 sm:text-sm"
                >
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"/>
                        <path d="M12 5v14"/>
                    </svg>
                    <span class="hidden sm:inline">Report an Item</span>
                    <span class="sm:hidden">Report</span>
                </a>

                <button
                    type="button"
                    @click="mobileOpen = !mobileOpen"
                    :aria-expanded="mobileOpen.toString()"
                    aria-controls="mobile-nav-panel"
                    aria-label="Toggle navigation menu"
                    class="inline-flex h-11 w-11 items-center justify-center rounded-lg bg-surface-container-lowest text-on-surface-variant shadow-xs ring-1 ring-outline-variant/40 transition-all hover:bg-surface-container hover:text-on-surface lg:hidden"
                >
                    <svg x-show="!mobileOpen" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="4" x2="20" y1="6" y2="6"/>
                        <line x1="4" x2="20" y1="12" y2="12"/>
                        <line x1="4" x2="20" y1="18" y2="18"/>
                    </svg>
                    <svg x-show="mobileOpen" x-cloak class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18"/>
                        <path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Navigation Panel -->
    <div
        id="mobile-nav-panel"
        x-show="mobileOpen"
        x-cloak
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 -translate-y-1"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-1"
        @click.outside="mobileOpen = false"
        class="border-t border-surface-container bg-surface-container-lowest lg:hidden"
    >
        <nav class="app-container flex flex-col gap-1 py-3" aria-label="Mobile navigation">
            <a
                href="{% url 'reports:home' %}"
                @click="mobileOpen = false"
                class="flex min-h-11 items-center justify-between rounded-lg px-3.5 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'home' %}bg-primary-container text-on-primary{% else %}text-on-surface hover:bg-surface-container-low{% endif %}"
            >
                <span>Home</span>
                <svg class="h-4 w-4 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m9 18 6-6-6-6"/>
                </svg>
            </a>
            <a
                href="{% url 'reports:list' %}"
                @click="mobileOpen = false"
                class="flex min-h-11 items-center justify-between rounded-lg px-3.5 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'list' %}bg-primary-container text-on-primary{% else %}text-on-surface hover:bg-surface-container-low{% endif %}"
            >
                <span>Browse Reports</span>
                <svg class="h-4 w-4 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m9 18 6-6-6-6"/>
                </svg>
            </a>
            <a
                href="{% url 'reports:create_by_type' 'lost' %}"
                @click="mobileOpen = false"
                class="flex min-h-11 items-center justify-between rounded-lg px-3.5 py-2.5 text-sm font-semibold text-on-surface hover:bg-surface-container-low"
            >
                <span>I Lost Something</span>
                <span class="badge badge-lost">Lost</span>
            </a>
            <a
                href="{% url 'reports:create_by_type' 'found' %}"
                @click="mobileOpen = false"
                class="flex min-h-11 items-center justify-between rounded-lg px-3.5 py-2.5 text-sm font-semibold text-on-surface hover:bg-surface-container-low"
            >
                <span>I Found Something</span>
                <span class="badge badge-found">Found</span>
            </a>
        </nav>
    </div>
</header>
